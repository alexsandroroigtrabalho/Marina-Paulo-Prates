<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!--
    Textura de fundo estilo carta náutica: grade de coordenadas (latitude/
    longitude), sondagens de profundidade (pontinhos) e um traço de curva
    batimétrica — tudo bem discreto, pra dar textura sem competir com o
    conteúdo das telas. Pensado pra repetir (tile) por todo o fundo.
  -->
  <g stroke="#0E4461" stroke-width="1" opacity="0.045">
    <line x1="0" y1="0" x2="240" y2="0" stroke-dasharray="1 7" />
    <line x1="0" y1="0" x2="0" y2="240" stroke-dasharray="1 7" />
  </g>

  <path d="M-10,150 C 40,130 80,168 130,148 S 220,128 250,150" stroke="#26799F" stroke-width="1" opacity="0.05" fill="none" />
  <path d="M-10,180 C 45,164 85,198 135,180 S 215,162 250,182" stroke="#26799F" stroke-width="1" opacity="0.035" fill="none" />

  <g fill="#0E4461" opacity="0.09">
    <circle cx="46" cy="38" r="1.4" />
    <circle cx="112" cy="70" r="1.4" />
    <circle cx="30" cy="112" r="1.4" />
    <circle cx="176" cy="46" r="1.4" />
    <circle cx="200" cy="104" r="1.4" />
    <circle cx="150" cy="210" r="1.4" />
    <circle cx="70" cy="200" r="1.4" />
    <circle cx="208" cy="196" r="1.4" />
  </g>
</svg>
